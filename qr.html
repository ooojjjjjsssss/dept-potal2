  html,body { margin:0; height:100%; }

  .qr { display:block; width:min(58vmin,640px); height:min(58vmin,640px); shape-rendering:crispEdges; }
  .hint { margin:0; font-size:clamp(14px,2.6vmin,28px); color:var(--soft); }
  .url { margin:0; font-size:clamp(16px,3vmin,32px); font-weight:700; word-break:break-all; }
  @media print { body { background:#fff; } .card { box-shadow:none; } }
